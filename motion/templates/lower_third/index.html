<!doctype html>
<!-- A Scene.ai motion template. __WIDTH__, __HEIGHT__, __DURATION__ and __SOUND__ are filled in by the studio before the
     render; the words come in as variables, so they are never read as markup. clip.mp4 is the chosen video. -->
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Name","default":"Name"},
  {"id":"subtitle","type":"string","label":"Line under it","default":""},
  {"id":"at","type":"number","label":"Comes in after","default":0.5},
  {"id":"hold","type":"number","label":"Stays for","default":3}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__WIDTH__, height=__HEIGHT__" />
    <script src="gsap.min.js"></script>
    <style>
      @font-face { font-family: Archivo; src: url("Archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: __WIDTH__px; height: __HEIGHT__px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; }
      #clip { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #third { position: absolute; left: 6vmin; bottom: 8vmin; max-width: 80%; display: flex; align-items: stretch; gap: 1.6vmin;
        font-family: Archivo, ui-sans-serif, system-ui, sans-serif; z-index: 2; }
      #bar { width: 0.8vmin; background: #ffa51f; transform-origin: bottom; }
      #words { padding: 1.4vmin 2.4vmin 1.6vmin 2vmin; background: rgba(16, 15, 14, 0.82); border-radius: 0.8vmin; overflow: hidden; }
      #title { color: #f2efea; font-size: 4.6vmin; line-height: 1.15; font-weight: 650; letter-spacing: -0.01em; }
      #subtitle { color: #c4beb4; font-size: 2.7vmin; line-height: 1.3; font-weight: 450; margin-top: 0.3vmin; }
      #subtitle:empty { display: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-width="__WIDTH__" data-height="__HEIGHT__">
      <video id="clip" class="clip" src="clip.mp4" data-start="0" data-duration="__DURATION__" data-track-index="0" __SOUND__ playsinline></video>
      <div id="third" class="clip" data-start="0" data-duration="__DURATION__" data-track-index="1">
        <div id="bar"></div>
        <div id="words"><div id="title"></div><div id="subtitle"></div></div>
      </div>
    </div>
    <script>
      const values = window.__hyperframes.getVariables();
      document.getElementById("title").textContent = values.title;
      document.getElementById("subtitle").textContent = values.subtitle;

      // The lower third is held inside the video: it comes in, stays, and is gone before the end.
      const length = __DURATION__;
      const start = Math.min(Number(values.at) || 0, Math.max(0, length - 1.5));
      const out = Math.min(start + 0.6 + (Number(values.hold) || 3), length - 0.5);
      const tl = gsap.timeline({ paused: true });
      tl.set("#third", { opacity: 0 }, 0);
      tl.set("#third", { opacity: 1 }, start);
      tl.fromTo("#bar", { scaleY: 0 }, { scaleY: 1, duration: 0.35, ease: "power3.out" }, start);
      tl.fromTo("#words", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, start + 0.1);
      tl.to("#third", { opacity: 0, x: -30, duration: 0.4, ease: "power2.in" }, out);
      tl.set({}, {}, length);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
