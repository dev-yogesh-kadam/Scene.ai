<!doctype html>
<!-- A Scene.ai motion template. __WIDTH__, __HEIGHT__ and __DURATION__ are filled in by the studio before the render;
     the words come in as variables, so they are never read as markup. -->
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"Title"},
  {"id":"subtitle","type":"string","label":"Line under it","default":""},
  {"id":"look","type":"string","label":"Look","default":"dark"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__WIDTH__, height=__HEIGHT__" />
    <script src="gsap.min.js"></script>
    <style>
      @font-face { font-family: Archivo; src: url("Archivo.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: __WIDTH__px; height: __HEIGHT__px; overflow: hidden; }
      body { --ground: #100f0e; --ink: #f2efea; --soft: #a8a39a; --mark: #ffa51f; background: var(--ground); }
      body[data-look="light"] { --ground: #f4f4f2; --ink: #171614; --soft: #5c5852; --mark: #c77700; }
      #root { width: 100%; height: 100%; }
      #card { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 2.4vmin; padding: 0 10vmin; text-align: center; font-family: Archivo, ui-sans-serif, system-ui, sans-serif; }
      #bar { width: 9vmin; height: 0.7vmin; background: var(--mark); transform-origin: center; }
      #title { color: var(--ink); font-size: 9vmin; line-height: 1.05; font-weight: 650; letter-spacing: -0.02em; overflow-wrap: anywhere; }
      #subtitle { color: var(--soft); font-size: 3.4vmin; line-height: 1.3; font-weight: 450; }
      #subtitle:empty { display: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DURATION__" data-width="__WIDTH__" data-height="__HEIGHT__">
      <div id="card" class="clip" data-start="0" data-duration="__DURATION__" data-track-index="0">
        <div id="bar"></div>
        <h1 id="title"></h1>
        <p id="subtitle"></p>
      </div>
    </div>
    <script>
      const values = window.__hyperframes.getVariables();
      document.body.dataset.look = values.look;
      document.getElementById("title").textContent = values.title;
      document.getElementById("subtitle").textContent = values.subtitle;

      const length = __DURATION__;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.2);
      tl.fromTo("#title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.35);
      tl.fromTo("#subtitle", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.7);
      tl.to("#card", { opacity: 0, duration: 0.5, ease: "power1.in" }, length - 0.5);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
